# Builds on the three systems rhun runs on, and runs the headless test against the latest rhun.
name: ci
on:
  push:
    branches: ["**"]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: bash
        run: |
          cc=cc; [ "$RUNNER_OS" = Windows ] && cc=clang
          $cc -std=c99 -O2 -Wall -Wextra -Werror -D_CRT_SECURE_NO_WARNINGS -o wordfreq main.c
  headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: rhun
        run: curl -fsSL https://github.com/vshvedov/rhun/releases/latest/download/install.sh | sh
      - name: Headless test
        run: |
          # extensions came with rhun 0.18.0 (views, completion and signature help too)
          v=$("$HOME/.local/bin/rhun" --version | sed 's/^rhun //')
          case "$v" in 0.[0-9].*|0.1[0-7].*) echo "rhun $v has no extensions: the headless test needs 0.18.0"; exit 0 ;; esac
          sh tests/run.sh "$HOME/.local/bin/rhun"

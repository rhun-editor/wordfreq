# Word Frequency: the open file's most frequent words as a bar chart in a tab of its own, kept
# current as you type; with protocol 1.1, the active file's words in a table in the bottom panel
# and their count in the status bar. Written in C on rhunext.h. https://rhun.app/extensions/v1/
# section 12a, and v1.1's "Retained views" and status-items.
name = wordfreq
owner = rhun-editor
title = Word Frequency
description = The open file's most frequent words as a bar chart that follows your typing.
icon = icon.png
color = #d9803f
version = 0.2.0
protocol = 1
on = command
run.linux-x86_64 = bin/wordfreq-linux-x86_64
run.macos-arm64 = bin/wordfreq-macos-arm64
run.windows-x64 = bin/wordfreq-windows-x64.exe

[commands]
chart = Chart Word Frequency

# protocol 1.1: a table rhun keeps, a tab of the bottom panel (ctrl+j)
[views]
words.title = Word Frequency
words.place = panel
words.kind = table

# protocol 1.1 (status-items): shown while a file is the active tab, before the program runs too;
# a click starts it and opens the chart, and once it runs the item counts the file's words
[status]
count.text = $(list) Words
count.tooltip = Chart the most frequent words of this file
count.command = chart
count.align = right
count.priority = 10
count.when = activeTab == doc

[subscribe]
opened = *
edits = *

[needs]
documents = read

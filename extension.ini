# Word Frequency: the open file's most frequent words as a bar chart in a tab of its own, kept
# current as you type. Written in C on rhunext.h. https://rhun.app/extensions/v1/ section 12a.
name = wordfreq
owner = rhun-editor
title = Word Frequency
description = The open file's most frequent words as a bar chart that follows your typing.
icon = icon.png
color = #d9803f
version = 0.1.0
protocol = 1
on = command
run.linux-x86_64 = bin/wordfreq-linux-x86_64
run.macos-arm64 = bin/wordfreq-macos-arm64
run.windows-x64 = bin/wordfreq-windows-x64.exe

[commands]
chart = Chart Word Frequency

[subscribe]
opened = *
edits = *

[needs]
documents = read
